# Nerves A/B boot
#
# grubenv on the ESP holds:
#   nerves_slot       a or b, the slot to boot
#   nerves_validated  1 once the running firmware called validate_firmware
#   nerves_tried      1 once an unvalidated slot has booted
#
# An unvalidated slot boots once. If it is still unvalidated on the next
# boot, GRUB goes back to the other slot and marks it validated; the
# ventuno-q-init script then brings the Nerves environment in line.

set timeout=0

# GRUB starts with root set to the ESP; the rootfs is on the same disk.
regexp --set 1:nerves_disk '^(.*),gpt[0-9]+$' "${root}"

load_env nerves_slot nerves_validated nerves_tried

# Without a readable grubenv, boot a slot that has a kernel, A first.
if [ "${nerves_slot}" != "a" -a "${nerves_slot}" != "b" ]; then
    if [ -f (${nerves_disk},gpt70)/boot/Image ]; then
        set nerves_slot=a
    else
        set nerves_slot=b
    fi
    set nerves_validated=1
fi

if [ "${nerves_validated}" != "1" ]; then
    if [ "${nerves_tried}" = "1" ]; then
        if [ "${nerves_slot}" = "b" ]; then
            set nerves_slot=a
        else
            set nerves_slot=b
        fi
        set nerves_validated=1
        set nerves_tried=0
    else
        set nerves_tried=1
    fi
    save_env nerves_slot nerves_validated nerves_tried
fi

if [ "${nerves_slot}" = "b" ]; then
    set nerves_part=71
else
    set nerves_part=70
fi

set nerves_root="(${nerves_disk},gpt${nerves_part})"

# The slot's own /boot/slot.cfg sets nerves_cmdline, so the command line
# changes with the firmware; this default covers a slot without one.
set nerves_cmdline="console=ttyMSM0,115200n8 clk_ignore_unused pd_ignore_unused"
if [ -f ${nerves_root}/boot/slot.cfg ]; then
    source ${nerves_root}/boot/slot.cfg
fi

echo "Booting slot ${nerves_slot} from ${nerves_root}"
linux ${nerves_root}/boot/Image root=/dev/mmcblk0p${nerves_part} rootfstype=squashfs rootwait ro ${nerves_cmdline}
devicetree ${nerves_root}/boot/monaco-arduino-monza.dtb
boot
