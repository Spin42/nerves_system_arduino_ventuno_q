# Sourced by grub.cfg on the ESP before it boots this slot.
#
# The last console is /dev/console; the kernel log also goes to the HDMI
# framebuffer (tty1).
set nerves_cmdline="console=tty1 console=ttyMSM0,115200n8 clk_ignore_unused pd_ignore_unused"

# A project names the sensor on Camera 0, 1 and 2 (none, imx296 or imx477)
# in /boot/cameras.cfg, added through its rootfs overlay:
#
#   set ventuno_q_cameras=imx296-imx296-imx477
#
# and the slot boots the matching device tree. Without it, no camera is
# described.
set nerves_dtb=monaco-arduino-monza.dtb
if [ -f ${nerves_root}/boot/cameras.cfg ]; then
    source ${nerves_root}/boot/cameras.cfg
fi
if [ -n "${ventuno_q_cameras}" ]; then
    if [ -f ${nerves_root}/boot/monaco-arduino-monza-${ventuno_q_cameras}.dtb ]; then
        set nerves_dtb=monaco-arduino-monza-${ventuno_q_cameras}.dtb
    else
        echo "No device tree for cameras ${ventuno_q_cameras}"
    fi
fi

# grub.cfg is written once at install and loads the base device tree, so the
# slot boots itself.
echo "Booting slot ${nerves_slot} from ${nerves_root} with ${nerves_dtb}"
linux ${nerves_root}/boot/Image root=/dev/mmcblk0p${nerves_part} rootfstype=squashfs rootwait ro ${nerves_cmdline}
devicetree ${nerves_root}/boot/${nerves_dtb}
boot
